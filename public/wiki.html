<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marshal Wiki</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-dark: #0f111a;
            --bg-sidebar: #161922;
            --bg-titlebar: #1e1e1e;
            --accent-blue: #60a5fa;
            --border-color: #2d313f;
        }

        body { 
            background-color: var(--bg-dark); 
            color: #d1d5db; 
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Fixed Titlebar at the top */
        .titlebar {
            height: 32px;
            background-color: var(--bg-titlebar);
            color: #858585;
            display: flex;
            justify-content: center;
            align-items: center;
            app-region: drag;
            width: 100%;
            flex-shrink: 0;
            border-bottom: 1px solid #2d2d30;
            user-select: none;
            z-index: 100;
        }

        /* Layout Container for Sidebar + Main */
        .app-container {
            display: flex;
            flex: 1;
            overflow: hidden; /* Prevents whole-page scrolling */
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3d4255;
        }

        /* Typography & Markdown Styling */
        .prose pre { 
            background-color: #161922 !important; 
            border: 1px solid var(--border-color); 
        }
        .prose code { 
            color: var(--accent-blue) !important; 
            background: transparent !important;
            font-weight: 500;
        }

        /* Sidebar UI States */
        .folder-content { transition: all 0.2s ease-in-out; }
        .active-file { 
            background-color: #1f232d !important; 
            color: var(--accent-blue) !important; 
            border-left: 2px solid var(--accent-blue); 
            border-radius: 0 4px 4px 0;
        }

        /* Fix for Search Input Focus */
        #wiki-search:focus {
            box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.2);
        }
    </style>
</head>
<body>

    <div class="titlebar">
        <span class="text-xs font-medium opacity-80">Marshal IDE - Wiki</span>
    </div>

    <div class="app-container">
        
        <aside class="w-80 bg-[#161922] border-r border-gray-800 flex flex-col shrink-0">
            <div class="p-4 border-b border-gray-800 flex justify-between items-center">
                <h1 class="text-lg font-bold text-white">Wiki Explorer</h1>
                <button id="back-btn" onclick="window.api.send('switch-page', 'index')" class="text-gray-400 hover:text-white hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                </button>
            </div>

            <div class="p-3 bg-[#11131c]">
                <input type="text" id="wiki-search" placeholder="Search titles or content..." 
                       class="w-full bg-[#0f111a] border border-gray-700 rounded px-3 py-2 text-sm text-white focus:border-blue-500 outline-none transition-all">
            </div>

            <nav id="sidebar-nav" class="flex-1 overflow-y-auto p-2 space-y-1">
                <div class="p-4 text-gray-600 text-xs animate-pulse">Initializing documentation...</div>
            </nav>

            <div id="mode-tag" class="p-2 text-[10px] uppercase tracking-widest text-center border-t border-gray-800 text-gray-600">
                Checking Environment...
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto bg-[#0f111a]">
            <article id="content-area" class="max-w-4xl mx-auto py-12 px-10 prose prose-invert prose-blue">
                <div id="main-content">
                    <h1 class="text-white">Welcome to Marshal Wiki</h1>
                    <p>Select a document from the explorer to begin viewing your project documentation.</p>
                    <div class="mt-8 p-4 bg-blue-900/10 border border-blue-900/30 rounded text-sm text-blue-300">
                        <strong>Tip:</strong> You can search for keywords across all your documents using the search bar on the left.
                    </div>
                </div>
            </article>
        </main>

    </div>

    <script>
        // Detection Logic
        const isElectron = typeof window.api !== 'undefined';
        const browserData = window.BROWSER_WIKI_DATA || null;
        let fullDataTree = [];

        async function init() {
            const sidebar = document.getElementById('sidebar-nav');
            const search = document.getElementById('wiki-search');
            const modeTag = document.getElementById('mode-tag');

            if (isElectron) {
                // ELECTRON APP MODE
                modeTag.innerText = "● LIVE MODE (APP)";
                document.getElementById('back-btn').classList.remove('hidden');
                try {
                    fullDataTree = await window.api.invoke('get-docs-structure');
                } catch (e) {
                    sidebar.innerHTML = `<div class="p-4 text-red-500 text-xs">IPC Error: ${e.message}</div>`;
                    return;
                }
            } else if (browserData) {
                // SELF-CONTAINED BROWSER MODE
                modeTag.innerText = "○ SNAPSHOT MODE (BROWSER)";
                fullDataTree = browserData;
            } else {
                // FALLBACK
                sidebar.innerHTML = `<div class="p-4 text-red-500 text-xs italic">Error: No documentation data found.</div>`;
                return;
            }

            renderSidebar(fullDataTree, sidebar, true); // Keep groups open

            // Search functionality
            search.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = filterData(fullDataTree, term);
                renderSidebar(filtered, sidebar, true);
            });
        }

        // Search both file names and content (content available in Browser/Snapshot mode)
        function filterData(items, term) {
            return items.map(item => {
                if (item.type === 'folder') {
                    const children = filterData(item.children, term);
                    return children.length > 0 ? { ...item, children } : null;
                }
                const matchName = item.name.toLowerCase().includes(term);
                const matchContent = item.content && item.content.toLowerCase().includes(term);
                return (matchName || matchContent) ? item : null;
            }).filter(Boolean);
        }

        function renderSidebar(items, container, forceOpen = true) {
            container.innerHTML = '';
            if (items.length === 0) {
                container.innerHTML = '<div class="p-4 text-gray-600 text-xs">No documents found.</div>';
                return;
            }

            items.forEach(item => {
                if (item.type === 'folder') {
                    const id = `f-${item.name.replace(/\s+/g, '-')}`;
                    const div = document.createElement('div');
                    div.className = "mb-2";
                    div.innerHTML = `
                        <button onclick="document.getElementById('${id}').classList.toggle('hidden')" 
                                class="flex items-center w-full px-2 py-1 text-[10px] font-bold text-gray-500 uppercase tracking-widest hover:text-gray-300 transition-colors">
                            <span class="mr-2 opacity-50">📂</span> ${item.name}
                        </button>
                        <div id="${id}" class="folder-content ml-3 border-l border-gray-800 space-y-1 mt-1 ${forceOpen ? '' : 'hidden'}"></div>
                    `;
                    container.appendChild(div);
                    renderSidebar(item.children, div.querySelector('.folder-content'), forceOpen);
                } else {
                    const btn = document.createElement('button');
                    btn.className = "wiki-file-btn w-full text-left px-3 py-1.5 rounded text-sm text-gray-400 hover:bg-[#1f232d] hover:text-blue-400 transition-all";
                    btn.innerHTML = `📄 ${item.name}`;
                    btn.onclick = (e) => {
                        // Clear active states
                        document.querySelectorAll('.wiki-file-btn').forEach(b => b.classList.remove('active-file'));
                        btn.classList.add('active-file');
                        loadDoc(item);
                    };
                    container.appendChild(btn);
                }
            });
        }

        async function loadDoc(item) {
            const area = document.getElementById('main-content');
            area.innerHTML = '<div class="text-blue-500 animate-pulse">Reading file...</div>';
            
            try {
                let markdown = "";
                if (isElectron && !item.content) {
                    // Fetch live from disk in Electron
                    markdown = await window.api.invoke('read-doc-file', item.path);
                } else {
                    // Use bundled content for browser/snapshot mode
                    markdown = item.content || "# Error\nNo content available for this file.";
                }
                
                area.innerHTML = marked.parse(markdown);
                // Scroll main content to top
                document.querySelector('main').scrollTop = 0;
            } catch (e) {
                area.innerHTML = `<h1 class="text-red-500">Error Loading Document</h1><p>${e.message}</p>`;
            }
        }

        window.onload = init;
    </script>
</body>
</html>
