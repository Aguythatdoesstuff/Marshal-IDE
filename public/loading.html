<!DOCTYPE html>
<html>
<head>
    <style>
    body {
        margin: 0;
        padding: 0;
        /* Matches the standard IDE dark theme */
        background-color: #1e1e1e; 
        color: #cccccc;
        font-family: 'Inter', 'Segoe UI', sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        /* Allows you to click and drag the splash window */
        -webkit-app-region: drag; 
    }

    .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        /* Increased spacing between Logo, Dots, and Text */
        gap: 50px; 
    }

.logo {
    width: 240px;  
    height: 240px;
    background: url('../build/icon.png') no-repeat center center; 
    background-size: contain;
    
    will-change: transform;
    transform: translateZ(0);
    backface-visibility: hidden;

    /* ANIMATION: 1.2s creates a firm 'thump-thump' rhythm */
    animation: heartbeat-star 1.2s infinite ease-in-out;
}

@keyframes heartbeat-star {
    0% {
        transform: scale(1) translateZ(0);
        filter: drop-shadow(0 10px 20px rgba(0,0,0,0.4)) brightness(1);
    }
    /* First 'Thump' */
    14% {
        transform: scale(1.06) translateZ(0);
        filter: drop-shadow(0 15px 30px rgba(255, 215, 0, 0.2)) brightness(1.2);
    }
    /* Brief recoil */
    28% {
        transform: scale(1) translateZ(0);
    }
    /* Second 'Thump' (The heart rhythm) */
    42% {
        transform: scale(1.09) translateZ(0);
        filter: drop-shadow(0 20px 40px rgba(255, 215, 0, 0.3)) brightness(1.3);
    }
    /* Rest period */
    70%, 100% {
        transform: scale(1) translateZ(0);
        filter: drop-shadow(0 10px 20px rgba(0,0,0,0.4)) brightness(1);
    }
}

    /* LARGE ANTI-FREEZE INDICATOR */
    .dots {
        display: flex;
        gap: 15px;
    }

    .dot {
        width: 14px;  
        height: 14px; 
        background-color: #444;
        border-radius: 50%;
        animation: dotFade 1.6s infinite;
    }

    /* Staggered animation for the "flowing" effect */
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    /* LARGE STATUS TEXT */
    .status-text {
        font-size: 18px; 
        font-weight: 600;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #858585;
        opacity: 0.8;
        /* Ensures text doesn't interfere with dragging */
        user-select: none; 
        -webkit-user-select: none;
    }

    /* ANIMATION KEYFRAMES */


    @keyframes dotFade {
        0%, 100% { 
            opacity: 1; 
            transform: scale(1); 
            background-color: #444;
        }
        50% { 
            opacity: 1; 
            transform: scale(1.3); 
            /* Subtle blue highlight to show active processing */
            background-color: #007acc; 
        }
    }
</style>
</head>
<body>
    <div class="container">
        <div class="logo"></div>
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <div class="status-text">Starting Marshal IDE</div>
    </div>
</body>
</html>
